[project]
name = "bridger"
version = "0.1.0"
description = "CLI-first context compiler for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.43.0",
    "openai-agents>=0.17.6",
    "orjson>=3.10",
    "pathspec>=0.12",
    "platformdirs>=4.3",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "rich>=13.9",
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-php>=0.24.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.15",
]

[project.scripts]
bridger = "bridger.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend-exclude = ["legacy"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
