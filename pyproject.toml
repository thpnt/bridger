[project]
name = "bridger"
version = "0.1.0"
description = "Repository intelligence and knowledge system for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "graspologic>=3.4,<4",
    "huggingface-hub>=0.34",
    "llama-cpp-python>=0.3.23",
    "networkx>=3.4",
    "numpy>=1.21,<2.5",
    "openai>=2.43.0",
    "orjson>=3.10",
    "pydantic>=2.10",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.0",
    "rich>=13.0",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-bash>=0.23,<0.27",
    "tree-sitter-c>=0.23,<0.25",
    "tree-sitter-c-sharp>=0.23,<0.25",
    "tree-sitter-cpp>=0.23,<0.25",
    "tree-sitter-elixir>=0.3,<0.5",
    "tree-sitter-fortran>=0.6,<0.8",
    "tree-sitter-go>=0.23,<0.26",
    "tree-sitter-groovy>=0.1,<0.3",
    "tree-sitter-java>=0.23,<0.25",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-json>=0.23,<0.26",
    "tree-sitter-julia>=0.23,<0.25",
    "tree-sitter-kotlin>=1.0,<2.0",
    "tree-sitter-lua>=0.2,<0.6",
    "tree-sitter-objc>=3.0,<4.0",
    "tree-sitter-php>=0.23,<0.25",
    "tree-sitter-powershell>=0.26,<0.28",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-ruby>=0.23,<0.25",
    "tree-sitter-rust>=0.23,<0.25",
    "tree-sitter-scala>=0.23,<0.27",
    "tree-sitter-swift>=0.7,<0.9",
    "tree-sitter-typescript>=0.23,<0.25",
    "tree-sitter-verilog>=1.0,<2.0",
    "tree-sitter-zig>=1.0,<2.0",
    "typer>=0.15",
]

[project.scripts]
bridger = "bridger.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
extend-exclude = ["legacy", "src/bridger/_vendor/graphify"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
exclude = ["^src/bridger/_vendor/graphify/"]
mypy_path = ["src"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.black]
extend-exclude = "^/src/bridger/_vendor/graphify/"
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
