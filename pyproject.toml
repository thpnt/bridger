[project]
name = "bridger"
version = "0.1.0"
description = "Repository intelligence and knowledge system for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "openai>=2.43.0",
    "orjson>=3.10",
    "pydantic>=2.10",
    "typer>=0.15",
]

[project.scripts]
bridger = "cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
extend-exclude = ["legacy"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = ["src"]
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
