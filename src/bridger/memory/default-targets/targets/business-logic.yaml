schema_version: 2
target_id: business-logic
target_contract_version: v3
activation: { mode: always }
depends_on: []
canonical_question: What product or domain behavior does the software implement, and what semantic rules must remain true regardless of implementation?
purpose: Explain product meaning, domain behavior, rules, invariants, states, transitions, and outcomes.
expected_abstraction: Deep implementation-grounded semantic understanding that remains technology-independent where possible.
always_relevant_scope:
  - Domain concepts, terminology, actors, actions, workflows, rules, invariants, validation, and eligibility.
  - Domain states, allowed and forbidden transitions, calculations, outcomes, side effects, relationships, and failures.
  - Implementation locations needed to ground and navigate product behavior.
conditional_scope:
  - Pricing, billing, subscriptions, entitlements, quotas, limits, approvals, and scheduling rules.
  - Domain permissions, lifecycle rules, calculations, regulatory constraints, and provider interactions that affect product behavior.
exclusions:
  - Bootstrap, routing, middleware, composition, persistence mechanics, provider protocols, operations, testing, conventions, and visual design.
boundary_guidance:
  - Own what the software means and guarantees, not the incidental components or storage mechanisms that implement it.
investigation_expectations:
  - >-
    Phase A — Build a domain inventory before deep-diving: principal actors,
    product/domain concepts, major capabilities and actions, meaningful domain
    states, and product-significant external interactions.
  - >-
    Phase B — For every major capability, map what can happen, who or what
    initiates it, under what conditions, which rules govern it, what changes
    semantically, what product-significant side effects occur, what can prevent
    or reject it, and where the behavior is actually implemented.
  - >-
    Phase C — Deeply trace the central capabilities end to end in executable
    source. A workflow is not covered by identifying its components. Follow
    callers and callees across files and boundaries through meaningful decisions,
    outcomes, alternate branches, and failure paths.
  - >-
    Synthesize in product/domain terms. The result should read like the domain
    manual a senior engineer carries mentally, not like an inventory of functions,
    classes, endpoints, or files.
evidence_expectations:
  - Ground central rules and workflows in implementation-level evidence across the relevant chain.
  - Use tests for invariants and edge cases and documentation for terminology, while surfacing conflicts with source.
completion_obligations:
  - obligation_id: domain-concepts
    related_obligation_ids:
      - domain-workflows
      - rules-invariants
      - domain-states-transitions
    description: Establish the principal domain model, actors, relationships, and major product capabilities.
    investigation_requirements:
      - Build an inventory of major product/domain capabilities from actual behavior, entry actions, models, handlers, services, tools, and provider interactions.
      - For each major capability, identify its initiator, semantic purpose, important concepts or actors, and implementation anchors.
      - Do not resolve after finding representative examples; account for the repository's central capabilities or explicitly record remaining uncertainty.
    applicability: always
  - obligation_id: domain-workflows
    related_obligation_ids:
      - rules-invariants
      - domain-states-transitions
      - domain-failures
    description: Explain the central product/domain workflows end to end in semantic terms.
    investigation_requirements:
      - For each central capability, trace at least one concrete path from trigger through eligibility or decisions, semantic state/outcome, product-significant side effects, and terminal outcome.
      - Follow callers and callees across files or component boundaries when the workflow crosses them.
      - Include meaningful alternate, rejection, fallback, partial-success, and failure paths where they alter product behavior.
      - Do not treat a component list or call graph as a completed workflow explanation.
    applicability: always
  - obligation_id: rules-invariants
    related_obligation_ids:
      - domain-states-transitions
      - domain-failures
    description: Make material business/domain rules, invariants, validation, eligibility, authorization, and limits explicit.
    investigation_requirements:
      - Inventory material decision rules attached to the major capabilities already identified.
      - Locate the executable enforcement of important rules and trace the values or conditions that drive the decision.
      - Distinguish semantic invariants from incidental implementation choices.
      - Treat comments, names, and documentation as intent unless executable behavior confirms them.
    applicability: always
  - obligation_id: domain-states-transitions
    related_obligation_ids:
      - domain-failures
    description: Explain meaningful domain states, transitions, lifecycle rules, and business-significant calculations.
    investigation_requirements:
      - Identify the states and transitions that change product meaning rather than merely technical representation.
      - Trace what creates, permits, prevents, or terminates each important transition and what semantic outcome follows.
      - Capture legal and materially forbidden transitions when the implementation establishes them.
      - Leave persistence representation, locking, and transaction mechanics to Data & State.
    applicability: always
  - obligation_id: domain-failures
    related_obligation_ids: []
    description: Explain product-significant outcomes, side effects, exceptional paths, and failure semantics.
    investigation_requirements:
      - Inventory the meaningful external or durable consequences of central capabilities.
      - Trace successful, rejected, failed, fallback, retry-exhausted, or partially completed branches far enough to establish their product outcome.
      - Distinguish infrastructure failure mechanics from the business/domain consequence exposed to the product.
    applicability: always
output_quality_expectations:
  - Use repository terminology, synthesize behavior, and separate semantic rules from implementation mechanics.
  - Be source-grounded, explicit about uncertainty, navigable, and free of generic domain-analysis filler.
