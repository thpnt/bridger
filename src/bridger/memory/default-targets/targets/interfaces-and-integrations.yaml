schema_version: 2
target_id: interfaces-and-integrations
target_contract_version: v3
activation: { mode: always }
depends_on: []
canonical_question: What capabilities cross repository or system boundaries, through what contracts, and how are those boundaries implemented?
purpose: Explain boundary contracts and external interactions from their declared surfaces through their internal handoffs.
expected_abstraction: Boundary-contract and external-interaction understanding.
always_relevant_scope:
  - Significant inbound and outbound boundaries, their direction, purpose, surfaces, payloads, responses, serialization, and mappings.
  - Boundary authentication, authorization, idempotency, timeouts, retries, failures, compatibility, callbacks, webhooks, and events.
conditional_scope:
  - HTTP, GraphQL, RPC, CLI, public library APIs, webhooks, events, sockets, streams, plugins, providers, generated clients, callbacks, and rate limits.
exclusions:
  - Product rules, generic internal component interactions, persistence internals, operational provider integration, and presentation.
boundary_guidance:
  - Own boundary contracts, adapters, and mechanics; defer internal architecture and product semantics.
investigation_expectations:
  - >-
    Phase A — Inventory significant inbound and outbound boundaries, callbacks,
    webhooks/events, streams, providers, and system-to-system handoffs. Do not
    infer a real integration from a dependency declaration alone.
  - >-
    Phase B — Classify each material boundary by direction, contract/serialization,
    authentication or trust mechanism, internal adapter/handoff, and reliability
    semantics.
  - >-
    Phase C — Deeply trace significant inbound boundaries as request/event arrival
    → validation/authentication → adaptation/deserialization → internal handoff
    → response/effect → error transformation/retry/idempotency, and outbound
    boundaries through the corresponding reverse handoff.
evidence_expectations:
  - Use routes, schemas, protocol definitions, event definitions, public exports, handlers, clients, and adapters.
  - Prefer contract and integration tests as support and never invent external facts absent from the repository.
completion_obligations:
  - obligation_id: inbound-interfaces
    related_obligation_ids:
      - contracts-mappings
      - boundary-authentication-security
      - boundary-internal-handoff
    description: Explain the significant inbound interfaces and their effective behavior.
    investigation_requirements:
      - Inventory material inbound HTTP, RPC, CLI, webhook, event, stream, message, or other externally initiated boundaries.
      - For important boundaries, trace arrival → authentication/verification → parsing/validation → mapping → internal handoff → effective response or side effect.
      - Follow outer exception and response handling far enough to establish the actual externally visible behavior.
    applicability: always
  - obligation_id: outbound-integrations
    related_obligation_ids:
      - contracts-mappings
      - boundary-authentication-security
      - error-retry-idempotency
      - callbacks-events-webhooks
      - boundary-internal-handoff
    description: Explain the significant outbound integrations and external-provider calls.
    investigation_requirements:
      - Inventory material external providers and outbound adapters from actual usages, not package dependencies alone.
      - Trace internal trigger → request/payload mapping → authentication/client adapter → provider call → response mapping → internal outcome.
      - Include material failure handling and provider-specific semantics at the boundary.
    applicability: always
  - obligation_id: contracts-mappings
    related_obligation_ids:
      - versioning-compatibility
      - boundary-internal-handoff
    description: Explain important boundary contracts, serialization, validation, and internal/external mappings.
    investigation_requirements:
      - Inspect the concrete request/event/payload models and the code that converts them to or from internal representations.
      - Verify required fields, normalization, validation, and mapping through usage.
      - Distinguish a model's accepted shape from behavior enforced elsewhere in the boundary flow.
    applicability: always
  - obligation_id: boundary-authentication-security
    related_obligation_ids: []
    description: Explain material authentication, verification, authorization, or trust-boundary mechanics when present.
    investigation_requirements:
      - Trace credential/signature/token origin through verification and effective allow/reject behavior.
      - Follow exceptions and middleware/outer handlers to determine the actual boundary result.
      - Distinguish configured secrets from mechanisms that truly enforce a boundary.
    applicability: conditional
    condition_hint: A significant system boundary authenticates, verifies, authorizes, signs, or otherwise establishes trust.
  - obligation_id: error-retry-idempotency
    related_obligation_ids: []
    description: Explain boundary error, retry, timeout, and idempotency semantics when present.
    investigation_requirements:
      - Trace representative success and failure paths through the full retry/error loop rather than reading constants or comments alone.
      - Verify retry counters, status selection, backoff, timeout, and idempotency-key behavior from executable control flow.
      - Identify where errors are transformed, swallowed, propagated, or converted into external responses.
    applicability: conditional
    condition_hint: Significant boundaries implement retries, timeouts, idempotency, deduplication, or non-trivial failure mapping.
  - obligation_id: callbacks-events-webhooks
    related_obligation_ids:
      - versioning-compatibility
      - boundary-internal-handoff
    description: Explain callback, event, webhook, or streaming contracts when present.
    investigation_requirements:
      - Trace event arrival or emission from transport through validation, dispatch, deduplication/ordering, handling, and acknowledgement/effect.
      - Identify event identities and material duplicate, replay, ordering, or acknowledgement semantics.
      - Distinguish transport lifecycle from the product meaning owned by Business Logic.
    applicability: conditional
    condition_hint: The repository receives or emits significant callbacks, events, webhooks, messages, or streaming interactions.
  - obligation_id: versioning-compatibility
    related_obligation_ids: []
    description: Explain interface versioning and compatibility behavior when present.
    investigation_requirements:
      - Determine whether versions are merely path/package metadata or drive actual negotiation/transformation/compatibility behavior.
      - Trace explicit compatibility adapters, version checks, or fallback paths where present.
      - Record unsupported or unspecified compatibility rather than inferring guarantees.
    applicability: conditional
    condition_hint: Significant interfaces expose or implement version negotiation, compatibility adapters, or multiple contract generations.
  - obligation_id: boundary-internal-handoff
    related_obligation_ids: []
    description: Explain how significant external boundaries hand work and data into internal runtime components.
    investigation_requirements:
      - Follow important adapters past parsing into the first meaningful internal owner or orchestration component.
      - For outbound boundaries, follow the return path far enough to establish how external results affect internal execution.
      - Use this handoff to connect Interface knowledge to Architecture without duplicating the complete runtime flow.
    applicability: always
output_quality_expectations:
  - Make consumers, compatibility constraints, adapters, and failure semantics clear.
  - Keep external unknowns explicit and avoid duplicating internal architecture or product meaning.
